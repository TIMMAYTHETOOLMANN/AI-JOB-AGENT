[package]
name = "autonomous_job_agent"
version = "0.1.0"
edition = "2021"
authors = ["Commander <commander@vanta-os.local>"]
description = "Autonomous headless job search, match, and apply agent"
license = "MIT"
repository = "https://gitlab.com/your_org/autonomous_job_agent"
keywords = ["automation", "agent", "jobs", "headless", "browser"]
categories = ["web-programming", "command-line-utilities"]
readme = "README.md"

[dependencies]
futures = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
base64 = "0.21"
chrono = "0.4"
log = "0.4"
env_logger = "0.10"
reqwest = "0.11"
scraper = "0.14"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
select = "0.5"
rust-ini = "0.18"
config = "0.13"
phf = "0.11"
string_cache = "0.8"
html5ever = "0.26"
cssparser = "0.31"
selectors = "0.25"
markup5ever = "0.11"
webpki = "0.22"
rustls = "0.20"
hyper-rustls = "0.23"
tokio-rustls = "0.23"
fantoccini = "0.19"
thirtyfour = "0.31"
ordered-multimap = "0.4"
hashbrown = "0.12"
ppv-lite86 = "0.2"
rand_chacha = "0.3"
rand_core = "0.6"
getrandom = "0.2"
ring = "0.17"
url = "2.5"
pin-project = "1.1"
winapi = "0.3"
windows = "0.52"
tempfile = "3.1"
regex = "1.10"
system_shutdown = "4.0.1"
anyhow = "1.0"
dotenv = "0.15"
eframe = "0.27"
egui = "0.27"
toml = "0.8"
lettre = "0.11"

# Development dependencies
[dev-dependencies]
test-generator = "0.3.1"

[[bin]]
name = "main_gui"
path = "src/main_gui.rs"

[[bin]]
name = "autonomous_job_agent"
path = "src/main.rs"
