[package]
name = "untitled1"
version = "0.1.0"
edition = "2021"
authors = ["Commander <commander@vanta-os.local>"]
description = "Autonomous headless job search, match, and apply agent"
license = "MIT"
repository = "https://gitlab.com/your_org/autonomous_job_agent"
keywords = ["automation", "agent", "jobs", "headless", "browser"]
categories = ["web-programming", "command-line-utilities"]
readme = "README.md"

[dependencies]
serde = { version = "1.0", features = ["derive"] }
tokio = { version = "1", features = ["full"] }
log = "0.4"
env_logger = "0.10"
reqwest = { version = "0.12", features = ["json", "blocking", "rustls-tls"] }
thirtyfour = "0.31"           # Headless browser automation (WebDriver)
playwright = "0.0.20"         # Playwright integration for headless browser automation
serde_json = "1.0"
config = "0.13"
anyhow = "1.0"
scraper = "0.18.1"            # HTML parsing
urlencoding = "2.1.3"         # URL encoding
