[package]
name = "autonomous_job_agent"
version = "0.1.0"
edition = "2021"
authors = ["Commander <commander@vanta-os.local>"]
description = "Autonomous headless job search, match, and apply agent"
license = "MIT"
repository = "https://gitlab.com/your_org/autonomous_job_agent"
keywords = ["automation", "agent", "jobs", "headless", "browser"]
categories = ["web-programming", "command-line-utilities"]
readme = "README.md"

[dependencies]
futures = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
toml = "0.8"
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
regex = "1.10"
uuid = { version = "1.0", features = ["v4"] }

# GUI dependencies
eframe = { version = "0.27", optional = true }
egui_extras = { version = "0.27", optional = true }
rfd = { version = "0.13", optional = true }
image = { version = "0.24", optional = true }

# Web server dependencies
axum = { version = "0.7", optional = true }
tower = { version = "0.4", optional = true }
tower-http = { version = "0.5", features = ["cors", "fs"], optional = true }
hyper = { version = "1.0", optional = true }
tokio-tungstenite = { version = "0.21", optional = true }

# Database and persistence
sled = { version = "0.34", optional = true }
bincode = { version = "1.3", optional = true }

# Enhanced browser automation
reqwest = { version = "0.11", features = ["json", "cookies"] }
scraper = "0.18"
headless_chrome = { version = "1.0", optional = true }

# Performance monitoring
metrics = { version = "0.22", optional = true }
metrics-exporter-prometheus = { version = "0.13", optional = true }

# Configuration and secrets management
config = "0.14"
keyring = { version = "2.0", optional = true }

# Browser automation features
[features]
default = ["production-gui", "web-server", "visible-chrome"]
production-gui = ["eframe", "egui_extras", "rfd", "image"]
web-server = ["axum", "tower", "tower-http", "tokio-tungstenite", "hyper"]
visible-chrome = []
headless-chrome = ["headless_chrome"]
database = ["sled", "bincode"]
metrics-export = ["metrics", "metrics-exporter-prometheus"]
secrets = ["keyring"]

[[bin]]
name = "test_autonomous"
path = "src/bin/test_autonomous.rs"

[[bin]]
name = "autonomous_job_agent"
path = "src/main.rs"

[[bin]]
name = "standalone_demo"
path = "src/bin/standalone_demo.rs"

[[bin]]
name = "optimization_demo"
path = "src/bin/optimization_demo.rs"

[[bin]]
name = "production_gui"
path = "src/bin/production_gui.rs"

[[bin]]
name = "web_server"
path = "src/bin/web_server.rs"

[[bin]]
name = "test_config"
path = "src/bin/test_config.rs"