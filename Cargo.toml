[package]
name = "autonomous_job_agent"
version = "0.1.0"
edition = "2021"
authors = ["Commander <commander@vanta-os.local>"]
description = "Autonomous headless job search, match, and apply agent"
license = "MIT"
repository = "https://gitlab.com/your_org/autonomous_job_agent"
keywords = ["automation", "agent", "jobs", "headless", "browser"]
categories = ["web-programming", "command-line-utilities"]
readme = "README.md"

[dependencies]
futures = "0.3"
tokio = { version = "1", features = ["full"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
anyhow = "1.0"
toml = "0.8"
url = "2.5"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rand = "0.8"
eframe = "0.27"
regex = "1.10"
reqwest = { version = "0.11", features = ["json", "cookies"] }
tokio-util = "0.7"

# Mock browser for testing without external dependencies
[features]
default = ["mock-browser"]
mock-browser = []
headless-chrome = []

[[bin]]
name = "autonomous_job_agent"
path = "src/main.rs"

[[bin]]
name = "test_config"
path = "src/bin/test_config.rs"

[[bin]]
name = "test_credentials"
path = "src/bin/test_credentials.rs"