stages:
  - build
  - test
  - deploy

variables:
  CARGO_TERM_COLOR: always

before_script:
  - rustup default stable
  - rustup update

build-job:
  stage: build
  script:
    - cargo build --release
  artifacts:
    paths:
      - target/release/autonomous_job_agent

test-job:
  stage: test
  script:
    - cargo test --release

deploy-job:
  stage: deploy
  image: docker:stable
  services:
    - docker:dind
  script:
    - docker build -t $CI_REGISTRY_IMAGE:latest .
    - docker login -u $CI_REGISTRY_USER -p $CI_REGISTRY_PASSWORD $CI_REGISTRY
    - docker push $CI_REGISTRY_IMAGE:latest
  only:
    - main

job-search-schedule:
  stage: deploy
  script:
    - ./target/release/autonomous_job_agent
  only:
    - schedules
